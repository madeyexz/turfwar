name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, build and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --cwd spacetimedb --frozen-lockfile
      - name: Test
        # Map tests trace every sightline on the big maps; shared runners are slower than a laptop.
        run: bun run test -- --testTimeout=120000
      - name: Build
        run: bun run build
      - name: Type-check the server module
        run: bun run typecheck:module
